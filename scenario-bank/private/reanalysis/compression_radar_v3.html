<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moral compression: v3</title>
<style>
 :root{--bg:#0d0d14;--surface:#1a1a28;--line:rgba(255,255,255,0.10);--text:#d8d8e0;--muted:#9a9aac;
   --human:#7f8bd6;--median:#e8a838}
 *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);
   font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5}
 .wrap{max-width:920px;margin:0 auto;padding:32px 20px 64px}
 h1{font-size:22px;font-weight:650;margin:0 0 4px;letter-spacing:-.01em}
 h2{font-size:15px;color:var(--muted);margin:38px 0 2px}
 p.note{color:var(--muted);font-size:13.5px;max-width:760px;margin:6px 0 0}
 .prelim{display:inline-block;font-size:11.5px;color:#8fd0ff;background:rgba(110,168,255,.10);
   border:1px solid rgba(110,168,255,.30);border-radius:5px;padding:1px 8px;margin-top:8px}
 .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 12px 8px;margin-top:14px}
 svg{display:block;width:100%;height:auto}
 .legend{display:flex;flex-wrap:wrap;gap:12px 16px;margin:10px 4px;font-size:12.5px;align-items:center}
 .legend span{display:inline-flex;align-items:center;gap:7px}
 .dot{width:11px;height:11px;border-radius:50%;display:inline-block}
 .cap{font-size:12.5px;color:var(--muted);margin:2px 6px 4px}
 .sep{width:1px;height:14px;background:var(--line);margin:0 2px}
 .lab{color:#8f8fa2;font-size:11.5px;margin:2px 6px 8px}
</style></head><body><div class="wrap">
 <h1 id="title"></h1>
 <p class="note" id="lede"></p>
 <div class="prelim">Full pilot &mdash; 11 models, 68 human respondents. Neutral frame, 12 baseline scenarios.</div>
 <h2>Radar &mdash; dots, not bands</h2>
 <div class="card"><div id="radar"></div>
  <div class="legend" id="legend_r"></div>
  <div class="cap" id="cap_r"></div>
 </div>
 <h2>True-scale strips &mdash; what the radar's geometry hides</h2>
 <div class="card"><div id="strips"></div>
  <div class="cap" id="cap_s"></div>
 </div>
 <div class="lab" id="labnote"></div>
</div>
<script>
try{
const D = {"n_human": 68, "n_model": 11, "labs": ["Anthropic", "DeepSeek", "Meta", "MiniMax", "Mistral", "Moonshot", "OpenAI", "ThinkingMachines", "xAI"], "axes": [{"id": "moral_agent", "name": "Moral Agent", "poleA": "Relational", "poleB": "Autonomous", "p50": 0.3556, "hmean": 0.2925, "hsd": 0.4124, "msd": 0.0609, "ratio": 6.78, "pval": 0.0, "humans": [0.0923, -0.4667, -0.06, -0.0381, 0.5941, 0.466, 0.8754, -0.1805, -0.6013, 0.6, 0.6404, 0.1515, 0.364, 0.4581, -0.4739, 0.0965, 0.8889, -0.1103, 0.2799, 0.2391, 0.1581, -0.1667, 0.4861, 1.0, -0.2178, 0.3691, -0.1165, -0.6118, 0.0, 0.5051, 0.3547, 0.0318, -0.0156, 0.48, 1.0, 1.0, 0.1195, 0.6474, -0.2015, 0.76, 0.3683, 0.74, -0.4898, -0.2394, 0.5957, -0.06, 0.2976, 0.619, 0.4, 0.462, 0.8, 0.7463, 0.7333, 0.6851, 0.2204, 0.7082, 0.7836, 0.1231, 0.4441, 0.6017, 0.063, 0.4177, 0.2608, 0.3565, -0.0216, 0.9277, -0.3632, 0.3143], "models": [{"m": "opus", "lab": "Anthropic", "v": -0.0879}, {"m": "sonnet", "lab": "Anthropic", "v": -0.0008}, {"m": "deepseek_v4", "lab": "DeepSeek", "v": -0.0449}, {"m": "llama33", "lab": "Meta", "v": -0.0392}, {"m": "minimax", "lab": "MiniMax", "v": -0.0459}, {"m": "mistral_large", "lab": "Mistral", "v": -0.1476}, {"m": "kimi", "lab": "Moonshot", "v": -0.1523}, {"m": "gpt55", "lab": "OpenAI", "v": -0.0792}, {"m": "o3", "lab": "OpenAI", "v": -0.0377}, {"m": "inkling", "lab": "ThinkingMachines", "v": 0.0676}, {"m": "grok45", "lab": "xAI", "v": -0.0056}]}, {"id": "authority", "name": "Authority", "poleA": "Deferential", "poleB": "Skeptical", "p50": 0.1998, "hmean": 0.1748, "hsd": 0.4012, "msd": 0.0521, "ratio": 7.69, "pval": 0.0, "humans": [-0.025, 0.2, 0.1667, -0.1215, 0.1118, 0.5599, 0.58, 0.122, 0.3121, -0.2, -0.0065, 0.2749, 0.0067, 0.3897, -0.0571, -0.1009, -0.8771, -0.3534, 0.2633, -0.4, 0.3633, 0.4155, 0.3286, -0.6901, 0.4132, -0.6987, 0.2355, 0.2, 0.5, 0.7928, 0.1808, 0.3784, -0.4659, -0.2, 0.4547, 0.7836, 0.3933, 0.1507, 0.2516, 0.5541, -0.2406, 0.0, 0.0642, -0.0965, 0.912, 0.9085, 0.6896, 0.5667, 0.6, 0.5819, -0.7, 0.9077, 0.0522, 0.1731, 0.4691, 0.3353, -0.7172, 0.5141, 0.1402, -0.2444, 0.1823, 0.0391, 0.5554, -0.0755, 0.3789, 0.3431, 0.158, 0.1995], "models": [{"m": "opus", "lab": "Anthropic", "v": 0.1215}, {"m": "sonnet", "lab": "Anthropic", "v": 0.065}, {"m": "deepseek_v4", "lab": "DeepSeek", "v": 0.204}, {"m": "llama33", "lab": "Meta", "v": 0.1227}, {"m": "minimax", "lab": "MiniMax", "v": 0.0385}, {"m": "mistral_large", "lab": "Mistral", "v": 0.082}, {"m": "kimi", "lab": "Moonshot", "v": 0.1413}, {"m": "gpt55", "lab": "OpenAI", "v": 0.177}, {"m": "o3", "lab": "OpenAI", "v": 0.1833}, {"m": "inkling", "lab": "ThinkingMachines", "v": 0.1021}, {"m": "grok45", "lab": "xAI", "v": 0.0587}]}, {"id": "domain_boundary", "name": "Moral Domain", "poleA": "Broad", "poleB": "Narrow", "p50": 0.4322, "hmean": 0.366, "hsd": 0.3271, "msd": 0.0609, "ratio": 5.37, "pval": 0.0, "humans": [0.3974, -0.2, -0.6, 0.3423, 0.6376, 0.449, 0.7698, 0.2119, 0.2279, 0.5, -0.1231, -0.0457, 0.7447, 0.7019, 0.6847, 0.1596, 0.5667, 0.4255, 0.6524, -0.2867, 0.6694, -0.3682, -0.0559, 0.7819, 0.8162, 0.7724, 0.3396, 0.0, 0.5, 0.6347, 0.4411, 0.59, 0.3793, 0.5, 0.75, 0.7635, 0.5638, 0.5584, 0.1008, 0.8273, 0.2952, 0.18, 0.2044, -0.0165, -0.4855, 0.4474, 0.6563, 0.6148, 0.39, 0.5527, 0.59, -0.2331, 0.1603, 0.3991, 0.6904, 0.3219, 0.5801, 0.3493, 0.2512, 0.093, 0.1037, 0.6052, 0.5754, 0.1758, 0.3705, 0.4389, 0.3296, 0.4709], "models": [{"m": "opus", "lab": "Anthropic", "v": 0.3303}, {"m": "sonnet", "lab": "Anthropic", "v": 0.2691}, {"m": "deepseek_v4", "lab": "DeepSeek", "v": 0.3458}, {"m": "llama33", "lab": "Meta", "v": 0.1667}, {"m": "minimax", "lab": "MiniMax", "v": 0.3043}, {"m": "mistral_large", "lab": "Mistral", "v": 0.2541}, {"m": "kimi", "lab": "Moonshot", "v": 0.2637}, {"m": "gpt55", "lab": "OpenAI", "v": 0.2993}, {"m": "o3", "lab": "OpenAI", "v": 0.2516}, {"m": "inkling", "lab": "ThinkingMachines", "v": 0.3212}, {"m": "grok45", "lab": "xAI", "v": 0.4156}]}, {"id": "scope", "name": "Obligation Scope", "poleA": "Relational", "poleB": "Universal", "p50": 0.4178, "hmean": 0.3726, "hsd": 0.3611, "msd": 0.0639, "ratio": 5.65, "pval": 0.0, "humans": [0.3774, -0.2667, -0.4667, 0.4263, 0.5555, 0.1779, 0.8439, 0.2732, 0.649, 0.7, 0.1461, 0.3903, 0.3, 0.4364, -0.1316, -0.1268, 0.3946, -0.178, 0.3371, 1.0, 0.5974, 0.0026, -0.0027, 0.6601, -0.2257, 0.65, 0.5586, -0.2778, 0.0164, 0.454, 0.5569, 0.2383, 0.6698, 0.3, 1.0, -0.1886, 0.4092, 0.2767, 0.553, 0.6053, 0.673, 0.7537, 0.002, -0.0526, 0.3, 0.4, 0.8592, -0.2077, 1.0, 0.617, 0.7596, 0.5055, 0.0028, 0.5429, 0.733, 0.3328, 0.7111, 0.515, 1.0, 0.6657, 0.2766, 0.7863, 0.4404, -0.3949, 0.1278, 0.6245, 0.4892, 0.1844], "models": [{"m": "opus", "lab": "Anthropic", "v": 0.2188}, {"m": "sonnet", "lab": "Anthropic", "v": 0.2776}, {"m": "deepseek_v4", "lab": "DeepSeek", "v": 0.3625}, {"m": "llama33", "lab": "Meta", "v": 0.2276}, {"m": "minimax", "lab": "MiniMax", "v": 0.2103}, {"m": "mistral_large", "lab": "Mistral", "v": 0.2304}, {"m": "kimi", "lab": "Moonshot", "v": 0.3304}, {"m": "gpt55", "lab": "OpenAI", "v": 0.3825}, {"m": "o3", "lab": "OpenAI", "v": 0.207}, {"m": "inkling", "lab": "ThinkingMachines", "v": 0.2959}, {"m": "grok45", "lab": "xAI", "v": 0.3555}]}]};
const LABCOLOR={"Anthropic":"#f59e0b","OpenAI":"#34d399","Google":"#60a5fa","xAI":"#e5e7eb",
 "Cohere":"#a78bfa","Mistral":"#f87171","DeepSeek":"#f472b6","MiniMax":"#22d3ee",
 "ThinkingMachines":"#a3e635","Meta":"#818cf8","Moonshot":"#fbbf24"};
const J=k=>((Math.sin(k*127.1+(k%7)*13.7)*43758.5)%1+1)%1-0.5;
document.getElementById("title").textContent =
  `Moral compression: ${D.n_human} humans spread, ${D.n_model} models pile up`;
document.getElementById("lede").textContent =
  `Same instrument for people and machines. Each blue dot is one of ${D.n_human} human respondents; `+
  `each colored dot is one of ${D.n_model} language models, colored by the lab that built it. `+
  `The humans splay across the whole axis; the models land in one tight knot.`;
(function(){
 const A=D.axes,N=A.length,W=800,H=600,cx=W/2,cy=H/2+6,R=210;
 const ang=i=>-Math.PI/2+i*2*Math.PI/N, rad=v=>(v+1)/2*R;
 const P=(v,i,off=0)=>{const a=ang(i);return [cx+rad(v)*Math.cos(a)+off*Math.cos(a+Math.PI/2), cy+rad(v)*Math.sin(a)+off*Math.sin(a+Math.PI/2)];};
 let s=`<svg viewBox="0 0 ${W} ${H}">`;
 [-1,-.5,0,.5,1].forEach(g=>{s+=`<polygon points="${A.map((_,i)=>P(g,i).join(",")).join(" ")}" fill="none" stroke="rgba(255,255,255,0.08)"/>`;});
 A.forEach((a,i)=>{const [ex,ey]=P(1,i);s+=`<line x1="${cx}" y1="${cy}" x2="${ex}" y2="${ey}" stroke="rgba(255,255,255,0.10)"/>`;
   const [lx,ly]=[cx+(R+38)*Math.cos(ang(i)),cy+(R+38)*Math.sin(ang(i))];
   const anc=Math.abs(Math.cos(ang(i)))<0.3?"middle":(Math.cos(ang(i))>0?"start":"end");
   s+=`<text x="${lx}" y="${ly}" fill="#d8d8e0" font-size="13" font-weight="600" text-anchor="${anc}" dominant-baseline="middle">${a.name}</text>`;
   s+=`<text x="${ex}" y="${ey-6}" fill="#7a7a8c" font-size="10" text-anchor="middle">${a.poleB}</text>`;});
 s+=`<polygon points="${A.map((a,i)=>P(a.p50,i).join(",")).join(" ")}" fill="none" stroke="var(--median)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
 A.forEach((a,i)=>a.humans.forEach((v,k)=>{const [x,y]=P(v,i,J(k+i*97)*13);s+=`<circle cx="${x}" cy="${y}" r="2.2" fill="var(--human)" fill-opacity="0.5"/>`;}));
 A.forEach((a,i)=>a.models.forEach((o,k)=>{const [x,y]=P(o.v,i,J(k*31+i*5)*9);
   s+=`<circle cx="${x}" cy="${y}" r="3.6" fill="${LABCOLOR[o.lab]||'#e05577'}" stroke="#0d0d14" stroke-width="0.8"/>`;}));
 s+="</svg>";document.getElementById("radar").innerHTML=s;
})();
(function(){
 const A=D.axes,W=770,rowH=92,padL=160,padR=132,topPad=16,H=topPad+A.length*rowH+14;
 const x0=padL,x1=W-padR, X=v=>x0+(v+1)/2*(x1-x0);
 let s=`<svg viewBox="0 0 ${W} ${H}">`;
 A.forEach((a,idx)=>{const cy=topPad+idx*rowH+rowH/2;
   s+=`<line x1="${x0}" y1="${cy}" x2="${x1}" y2="${cy}" stroke="rgba(255,255,255,0.12)"/>`;
   [-1,-0.5,0,0.5,1].forEach(t=>{s+=`<line x1="${X(t)}" y1="${cy-32}" x2="${X(t)}" y2="${cy+32}" stroke="rgba(255,255,255,0.06)"/>`;});
   s+=`<text x="${x0-12}" y="${cy-6}" fill="#d8d8e0" font-size="12.5" font-weight="600" text-anchor="end">${a.name}</text>`;
   s+=`<text x="${x0-12}" y="${cy+10}" fill="#7a7a8c" font-size="10" text-anchor="end">${a.poleA}</text>`;
   s+=`<text x="${x1+5}" y="${cy+3}" fill="#7a7a8c" font-size="10">${a.poleB}</text>`;
   s+=`<line x1="${X(a.p50)}" y1="${cy-30}" x2="${X(a.p50)}" y2="${cy+30}" stroke="var(--median)" stroke-width="1.3" stroke-dasharray="4 3"/>`;
   a.humans.forEach((v,k)=>{const jy=cy+J(k+idx*53)*46;s+=`<circle cx="${X(v)}" cy="${jy}" r="2.3" fill="var(--human)" fill-opacity="0.45"/>`;});
   a.models.forEach((o,k)=>{const jy=cy+J(k*17+idx*3)*22;
     s+=`<circle cx="${X(o.v)}" cy="${jy}" r="3.7" fill="${LABCOLOR[o.lab]||'#e05577'}" stroke="#0d0d14" stroke-width="0.8"/>`;});
   s+=`<text x="${x1+5}" y="${cy-24}" fill="#f472b6" font-size="10.5">${a.ratio}x tighter</text>`;
 });
 s+=`<text x="${X(-1)}" y="${H-3}" fill="#6a6a7c" font-size="9.5">-1</text><text x="${X(0)}" y="${H-3}" fill="#6a6a7c" font-size="9.5" text-anchor="middle">0</text><text x="${X(1)}" y="${H-3}" fill="#6a6a7c" font-size="9.5" text-anchor="end">+1</text>`;
 s+="</svg>";document.getElementById("strips").innerHTML=s;
})();
(function(){
 let h=`<span><i class="dot" style="background:var(--human);opacity:.6"></i> Humans (n=${D.n_human})</span>`+
   `<span><i class="dot" style="background:var(--median);border-radius:2px;width:16px;height:4px"></i> Human median</span>`+
   `<span class="sep"></span>`;
 D.labs.forEach(l=>{h+=`<span><i class="dot" style="background:${LABCOLOR[l]||'#e05577'}"></i>${l}</span>`;});
 document.getElementById("legend_r").innerHTML=h;
})();
const rlo=Math.min(...D.axes.map(a=>a.ratio)), rhi=Math.max(...D.axes.map(a=>a.ratio));
const ma=D.axes.find(a=>a.id==='moral_agent');
const maMean=ma.models.reduce((s,o)=>s+o.v,0)/ma.models.length;
document.getElementById("cap_r").innerHTML =
  `Humans spray from center to rim on every spoke; the models sit in one tight arc. The human side is the `+
  `classic WEIRD profile &mdash; autonomous, skeptical of authority, narrow moral domain, universalist. On three `+
  `axes the models lean the same direction as the humans, only muted and bunched. On <b style="color:#d8d8e0">Moral `+
  `Agent</b> they break the other way: the models sit <i>relational</i> (mean ${maMean>=0?'+':''}${maMean.toFixed(2)}) `+
  `where the human median is <i>autonomous</i> (${ma.p50.toFixed(2)}).`;
document.getElementById("cap_s").innerHTML =
  `Each axis at its true linear scale. Model spread is <b style="color:#d8d8e0">${rlo} to ${rhi}&times; tighter</b> `+
  `than humans in SD on every axis. On a size-matched bootstrap (100,000 draws of ${D.n_model} random humans) not one `+
  `draw was as clustered as the model panel on any axis &mdash; p &lt; 0.00001. Dots colored by lab show the knot is `+
  `lab-mixed: DeepSeek, MiniMax, and Kimi (Chinese labs) fall inside the same sliver as the Western models.`;
document.getElementById("labnote").textContent =
  "Population SD. Human baseline re-scored with the same function as the models, from raw allocation weights. "+
  "Model points: neutral-frame allocation over 5 iterations x 12 baseline scenarios. Dots jittered for visibility only.";

}catch(e){document.body.style.margin='0';document.body.innerHTML='<div style="font-family:system-ui;color:#9a9aac;background:#0d0d14;min-height:100vh;padding:48px;font-size:14px;line-height:1.7">This is a <b style=\'color:#d8d8e0\'>template</b>, not the finished figure.<br>Run <b style=\'color:#d8d8e0\'>python3 private/viz/build_figures.py</b> to generate the figure with data (written to <code>private/reanalysis/</code>).</div>';}
</script></body></html>
